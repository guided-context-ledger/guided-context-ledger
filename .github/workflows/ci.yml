name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [18, 20, 22] }
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      # Build BEFORE test: the connector's tests import the core's compiled
      # dist (@guided-context-ledger/core), so the workspace must be built first
      # on a fresh checkout, or those imports fail with ERR_MODULE_NOT_FOUND.
      - run: npm run build
      - run: npm test
      # The scaffold is part of the product: fail if required pieces go missing.
      - name: Scaffold sanity
        run: |
          test -f workspace.manifest.md
          test -f .gcl/HEAD
          test -f .gcl/ledger/revisions.jsonl
          test -f templates/agent-profile.template.md
          test -f templates/workspace-template/workspace.manifest.md
